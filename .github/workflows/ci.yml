name: CI

# Three jobs, deliberately unequal. `test` is the only required status check, so a merge waits on
# it alone: guards, syntax, the flat smoke run, that same harness run against real bands, and the
# eight probes whose verdict is an exit code the probe itself computes (#89). The rest of the probes and the extra seeds run beside it in
# their own jobs and report what they find without holding anyone up - the difference between a
# check that is informative and a check that is a toll booth is whether it shares a job with the
# gate. Previously all of it lived in one job, so a merge paid 6 minutes for numbers nobody acts
# on and the assertion everyone cares about was 15% of the wall time.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Workflow YAML parses and can run
        # The other half of #107's fix. This job is a required check, so a pr-guard.yml that no longer
        # parses fails HERE instead of vanishing; tools/wfyaml.rb says why an unparseable workflow is
        # worse than a failing one.
        run: ruby tools/wfyaml.rb --dir .github/workflows

      - name: Release policy regression checks
        run: python3 -m unittest discover -s tools -p test_release_policy.py

      - name: README keeps deployed screenshots
        run: |
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import re
          assert re.search(r'!\[[^\]]*\]\([^)]*docs/screens/[^)]*\.png[^)]*\)', Path('README.md').read_text()), 'README must embed deployed screenshots'
          PY_CHECK

      - name: Must stay dependency-free
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "package.json appeared in the tree."
            echo "This game loads js/*.js as plain scripts in numeric filename order and installs nothing."
            echo "If a dependency is genuinely required, that is a design change - discuss it first."
            exit 1
          fi

      - name: Syntax check, in index.html load order
        run: |
          set -euo pipefail
          # Load order matters: these files share globals, so a file that parses alone can still
          # depend on something defined later. Check them in the order the browser reads them.
          n=0
          for f in $(grep -o 'src="js/[^"]*"' index.html | sed 's/src="//; s/"//'); do
            echo "-- $f"
            node --check "$f"
            n=$((n + 1))
          done
          echo "checked $n script tags"
          test "$n" -ge 1

      - name: Smoke (save/restore balance, colour variety, raster budget, asset memory)
        run: |
          set -euo pipefail
          out=$(node tools/smoke.js 2>&1) || true
          echo "$out" | tail -20
          # Gate on the tool's verdict, not on a grep that can match a failing run.
          case "$out" in
            *"SMOKE PASSED"*) echo "smoke gate: PASS" ;;
            *) echo "smoke gate: FAIL"; exit 1 ;;
          esac

      - name: Smoke against real bands (VERT=1 lane, movers/portal/blasts at altitude)
        run: |
          set -euo pipefail
          out=$(VERT=1 node tools/smoke.js 2>&1) || true
          echo "$out" | sed -n '/--- VERT lane/,$p'
          # The lane's gating rows are ordinary asserts, so a REGRESSION (a shot passing through a
          # floor again, gravity deleted) fails the merge. Its KNOWN rows are filed defects that
          # re-read their own measurement every run and promote themselves to asserts when fixed, so
          # this step goes red on a regression without being a toll booth for #105 and #98.
          case "$out" in
            *"SMOKE PASSED"*) echo "vert smoke gate: PASS" ;;
            *) echo "vert smoke gate: FAIL"; exit 1 ;;
          esac

      - name: The local verify roster is this workflow, not a copy of it (#338)
        run: |
          set -euo pipefail
          # AGENTS.md's verify block used to be a hand-copied SUBSET of the commands below, and the two
          # lists drifted: `node tools/view.js cull` printed `CULL ok` on bytes where this file's
          # env-gated `LEAK=1 CZBAND=1 node tools/view.js cull` printed `CULL 3 FAILURES` (#338). The
          # defect was which invocations run, not how strict a compare is.
          # tools/roster.js therefore carries NO list of modes: it parses this file, with each line's own
          # VAR= prefix and line number, by two independent means (a structural walk of jobs/steps/run
          # blocks, and a structure-blind scan of every non-comment line attributed by line range), and
          # this step fails if those two disagree, if a blocking invocation cannot be replayed as stated,
          # or if a command sits commented-out in a gate. Runs nothing, under a second, so it can fail
          # before the probes it audits.
          # What a developer runs locally is the same parse: `node tools/roster.js` replays every
          # blocking invocation below in order and prints one verdict line plus an exit code per
          # invocation, continuing past failures and exiting non-zero iff any failed.
          node tools/roster.js --list

      - name: Probe gates (deterministic verdicts, must stay green)
        run: |
          set -euo pipefail
          # Thirteen modes in fourteen invocations whose verdict the code itself turns into an exit
          # code (cull runs twice, the second env-gated), that seed their own or run under CI's fixed
          # SEED, and that write no artifact - which is why they live in the required job and not beside
          # it (#89). Timed on a loaded box (load ~3) at 4.7-21 s each, flatparity and anim the largest;
          # the absolute numbers are load-dependent, the verdicts are not.
          # heights and mip contain art-tuned thresholds: if one trips on a shading change it tripped
          # reproducibly, and that is a verdict about the change, not a flake.
          #   heights  ground solved per cell, which half of the frame moved, decal + deferred coverage
          #   mip      grazing-angle streak against the 1-D and mush controls
          #   anim     a body changes SHAPE while it walks, per kind, and dies 3 distinct ways per kind
          #   props    quad-vs-mesh, scale window, emissive exemption, feet on the floor
          #   vert     walk / step / fall / damage / ladder / spawn-altitude rows
          #   planes   derived ceiling array vs its formula, and the #55 raise-restore stale-blocker run
          #   sight    a shot aimed at a body on another band hits it, and a level shot does not hit
          #            through the floor under it - both directions fail, only the band-relative window passes
          #   horizon  the horizon belongs to the camera, not to the floor, and the eye tracks
          #            the band it stands in - the row that used to report #103 now gates it
          #   cull     a body is drawn on the band it stands on AND a step occludes what is behind
          #            it: the row that used to report #100 (a raised band blocked movement and drew
          #            nothing) now gates it, so an invisible step fails the build
          node tools/view.js heights
          node tools/view.js mip
          node tools/view.js anim
          node tools/view.js props
          node tools/view.js vert
          node tools/view.js planes
          node tools/view.js sight
          node tools/view.js drop
          node tools/view.js horizon
          node tools/view.js cull
          #   leak     which ground path paints a seam pixel, plus the ceiling-step ground hash whose
          #            wrong-fix falsifier (#177) no other row can see - the nearer-plane rule applied
          #            to the CEILING branch only leaves every shipped verdict green, and only these
          #            two rows go red. Env-gated, so the plain cull run above stays byte-identical.
          LEAK=1 CZBAND=1 node tools/view.js cull
          #   bands    #164's legibility gate: at a step lip the PIXELS must step where the DEPTH
          #            buffer steps (the measured pair across the lip, and the % of lip pixels within
          #            10 luminance of their neighbour), the seam term must be a narrow band AT the
          #            crease and not a tint (its depth, its width against the riser's own height,
          #            and how much of it survives a band's width away), and the minimap must ink
          #            off-datum cells in colours the datum cells do not use
          node tools/view.js bands
          #   alt      M3's exit gate on GENERATED levels: two bands or more, an unblocked link into
          #            every band above the datum, no open cell the height-aware crossing rule cannot
          #            reach, a staircase climbable on foot, no face of span<=0. It replaces the
          #            flatness assertion that was M0's exit gate, and it pokes nothing. Its two
          #            direction rows are ALSO the only thing here that sees the SIGN of the band term
          #            - see the flatparity note below, and run both when a band term is in the diff.
          node tools/view.js alt
          #   volume   #282/#284's seed gate, and the only roster row that looks at MORE THAN ONE deal:
          #            12 generations x 3 levels with no raster (~1.4 s), verdict + exit. It fails a deal
          #            that authors no volume at all (#282 - 3 of 36 deals on main, every one of them
          #            because the tall-room candidate filter came back empty) or no sunken floor
          #            REACHABLE FROM THE SPAWN SEAT (#284 - SEED 3 level 0 reached 146 cells above the
          #            datum and 0 below it), so a level cannot be multi-storey in MAP.fz and still flat
          #            for whoever spawns in it. Per-seed deals need BOOT=1; the default sweeps rounds of
          #            one stream and says so in its own verdict line.
          node tools/view.js volume
          #   flatparity  the invariant AGENTS.md names as the backwards-compat test for every vertical
          #            change - "every new formula must collapse to the old one exactly, bit for bit" -
          #            existed only as a sentence in PR bodies until #210 gave it md5 literals, and no
          #            step ran it until now (#211): an unwired verdict rots back into a caption exactly
          #            like the prose did. ONE command runs BOTH senses, because the probe spawns the
          #            other lamp record cold (view.js's spawn) rather than waiting for a human to
          #            remember the knob - which is the failure mode this row exists to remove:
          #              PARITY  [LAMPS=off]  f9e4da3a / f05beeb5 / d4b2d2cd, means 79.7 / 34.1 / 47.5
          #                  the top-up never authored, so the lamp record is 2c5a94f's and the ONLY
          #                  difference from that build is the band term in splatLight. This is the
          #                  formula-collapse proof a shading change is gated on.
          #              LOCK    [LAMPS unset] 4262d051 / f05beeb5 / 050b225e, means 81.3 / 34.1 / 51.7
          #                  the shipped record. A regression lock on lamp PLACEMENT: it moves when a
          #                  placement rule moves, so green there is NOT evidence a term is bit-neutral
          #                  (#208's top-up moved L0 and L2 with the kernel measured bit-neutral).
          #            Costs ~96 s here, the most expensive row in this step (#243 raised it from ~37 s):
          #            the DEALT sampler now boots before EVERY level, because the gun depth scratch is
          #            cleared over the rect the PREVIOUS frame wrote (js/13_mesh.js:858), so a fresh
          #            level used to inherit the previous level rect and the hash depended on render order.
          #            KNOWN BLINDNESS, printed by the probe beside its verdict, not hidden in a comment:
          #            the probe forces MAP.fz flat, so fd = 0 in every cell and the band term is the
          #            literal 1 before any sign is read. The one-sided kernel `lf - floor >= -ZQ - 1e-9`
          #            therefore prints ok on all six rows and hashes BOTH triples byte-identical while
          #            alt FAILs 169 / 279 / 117 cells lit from a band above on that same kernel (measured
          #            at 4495c08 and at 7f62f82; #211's body quotes 273 for L1, which does not reproduce
          #            here - the row that gates is `alt`, not this note). Flat parity is necessary and never
          #            sufficient:
          #            a green row here does not prove a band term exists, only that it collapses.
          node tools/view.js flatparity

      - name: Capture-caption gate - README's quoted numbers vs the committed PNGs
        run: |
          set -euo pipefail
          # BLOCKING, and it is the whole content of #235: the five captions in README.md carry typed
          # numbers, and the audit that opened the issue read 8 of 23 of them as no longer matching the
          # bytes or the probe they cite - including two decode lists in the same file that disagreed
          # with each other. tools/recap.js decodes docs/screens/*.png itself (chunk walk, inflate and
          # the five scanline filters, no dependency - the reader half of tools/png.js) and compares
          # against README.md's own `decode to **a / b / c / d / e**` lists, read in the order the images
          # are embedded, and against every "<N> (of M) rows average under|below luminance <T> ... longest
          # unbroken run is <R> rows ... row <S>" sentence, attributed to the image block it sits under.
          # Mean tolerance 0.005, row statistics exact, always measured at the tool's own threshold so a
          # caption cannot pick its own bar. Deterministic (no RNG, no browser, no network) at ~2 s.
          # Vacuity is a FAILURE and not a pass with an explanation: nothing decodable, an embed with no
          # file behind it, a decode that is not a page screenshot, or a README that quotes no numbers all
          # exit 1. Seen to fail three ways before it was wired - two PNGs swapped in a scratch copy
          # (mean 87.67 quoted against 24.69 in the bytes, rows 0 against 417), one caption's mean
          # re-generated to 88.67, and DIR pointed at a directory with no PNGs in it.
          node tools/recap.js check

      - name: Composited exposure gate on the live page
        # BLOCKING since the level-2 lamp fix (#143): level 2 read 53 raster / 38 composited and now reads 73 on
        # both layers, with levels 0 and 1 generating byte-identical levels. Deliberately not continue-on-error -
        # reporting is not gating, which is #47's whole point. #149 owns the tail this step still hides: the
        # median passes on level 2 while 2 of 5 rolls do not, so read the printed rolls, not just the verdict.
        run: |
          set -euo pipefail
          # The brightness the player actually sees lives in the display canvas, AFTER bloom, grade,
          # grain and the HUD overlay, and no headless probe can read it: the canvas stub in
          # tools/view.js no-ops drawImage and throws on getImageData, so every exposure assert that
          # existed before #47 measured the raster before post FX - a page that composited too dark
          # or too bright passed CI while every brightness gate stayed green (#85). This step drives
          # the system Chrome over the DevTools protocol with node built-ins only (no package.json,
          # which the step above guards) and reads the frame through DEV.lum().
          # The rule is the MEDIAN of 5 seeded rolls per level inside 60-100, because the roll-to-roll
          # spread is 18-70 points, WIDER than the 40-point window, so one roll outside it proves
          # nothing (#87) and the spread is printed rather than asserted. The dice are view.js
          # exposure's own (1000 + level*97 + roll*13), so the two tools measure the same generated
          # levels and a red row here is reproducible rather than a dice roll.
          # Exit codes are distinct: 1 outside the window, 3 NOT MEASURED (no browser, no DEV, page
          # threw, no canvas pixels) - a run that could not measure never reports a passing grade.
          node tools/ci/assert.js exposure

      - name: Audio gate (every sound rendered through an OfflineAudioContext)
        # BLOCKING since #157: chain() took the pan argument straight to connect() while every caller
        # passes a NUMBER (panOf returns Math.sin), so the first sound with any stereo position threw -
        # and the fault wrapper turns one throw into silence for EVERY sound for the rest of the page's
        # life, with no exception escaping and nothing on screen. Three audio bugs before this one were
        # each found by a person noticing the game had gone quiet, because no assert touched SND.
        # Each sound gets its own OfflineAudioContext: deterministic, needs no output device, and still
        # real WebAudio, so a wrong node signature throws exactly as it does in a browser. A real-time
        # AnalyserNode tap was tried first and measures a render clock that does not advance in
        # --headless=new - every peak came back as the same constant, i.e. a gate that could not fail.
        # Exit codes: 1 a sound threw or rendered silence, 3 NOT MEASURED (no browser, no DEV, an
        # inability to hook the graph) - a run that could not measure never reports a passing grade.
        run: |
          set -euo pipefail
          node tools/ci/assert.js audio

  probes:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probes (they report, they do not gate)
        run: |
          set -uo pipefail
          # Reporting only: several of these describe known debt, and a red X that means "the ceiling
          # still has no anisotropic filtering" teaches everyone to ignore the checks that mean
          # something else. What changed is that each probe's own exit code is now captured and
          # printed. Before, this step ran `set -uo pipefail` with no -e and six bare commands, so its
          # status was the LAST probe's and a failure in the first five was thrown away (#89).
          # Read the list below as measurements, not as coverage. Measured on this tree rather than
          # remembered - a per-block grep of tools/view.js for process.exit says 17 of its 21 verdict-
          # printing blocks end in one (alt, contrast and exposure now do, and exposure's rows are
          # hash-free but numeric-locked - #216). The four that still compute no exit code at all are
          # play, decal, diag and stats, and rig has a problem counter that is printed but not wired to
          # one. A "pass" line here does not mean checked; `refs` prints how many records exist.
          status=0
          for p in alt exposure contrast rig stats sheets decal diag viewmodel; do
            if node tools/view.js "$p" >/tmp/probe_$p.log 2>&1; then r=pass; else r=FAIL; status=1; fi
            echo "== $p: $r"
            tail -6 /tmp/probe_$p.log
          done
          # play (51 s) and scene (an artifact dump) stay out of CI entirely; run them by hand.
          exit $status

  seeds:
    name: seeds (informational)
    continue-on-error: true
    # Main pushes only. These two seeds exist to say "the numbers move a lot between generated
    # levels" - nothing about a diff can change that verdict, so running them per PR and per branch
    # push burned ~6 runner-minutes each time to re-print a known constant. The coverage still
    # happens after every merge, which is where a regression would actually show up.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Other seeds
        run: |
          set -uo pipefail
          # SEED=777 fails the perf gate on code nobody changed (docs/ROADMAP.md P0) and this step cost more
          # than smoke itself, so it cannot live where it gates a merge.
          for s in 777 31337; do
            if out=$(SEED=$s node tools/smoke.js 2>&1); then
              echo "seed $s: passed"
            else
              echo "seed $s: would fail the gate (tracked as docs/ROADMAP.md P0, not blocking any PR)"
              printf '%s\n' "$out" | tail -6
            fi
          done
