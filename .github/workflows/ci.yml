name: CI

# Three jobs, deliberately unequal. `test` is the only required status check, so a merge waits on
# it alone: guards, syntax, the flat smoke run, that same harness run against real bands, and the
# eight probes whose verdict is an exit code the probe itself computes (#89). The rest of the probes and the extra seeds run beside it in
# their own jobs and report what they find without holding anyone up - the difference between a
# check that is informative and a check that is a toll booth is whether it shares a job with the
# gate. Previously all of it lived in one job, so a merge paid 6 minutes for numbers nobody acts
# on and the assertion everyone cares about was 15% of the wall time.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Must stay dependency-free
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "package.json appeared in the tree."
            echo "This game loads js/*.js as plain scripts in numeric filename order and installs nothing."
            echo "If a dependency is genuinely required, that is a design change - discuss it first."
            exit 1
          fi

      - name: Syntax check, in index.html load order
        run: |
          set -euo pipefail
          # Load order matters: these files share globals, so a file that parses alone can still
          # depend on something defined later. Check them in the order the browser reads them.
          n=0
          for f in $(grep -o 'src="js/[^"]*"' index.html | sed 's/src="//; s/"//'); do
            echo "-- $f"
            node --check "$f"
            n=$((n + 1))
          done
          echo "checked $n script tags"
          test "$n" -ge 1

      - name: Smoke (save/restore balance, colour variety, raster budget, asset memory)
        run: |
          set -euo pipefail
          out=$(node tools/smoke.js 2>&1) || true
          echo "$out" | tail -20
          # Gate on the tool's verdict, not on a grep that can match a failing run.
          case "$out" in
            *"SMOKE PASSED"*) echo "smoke gate: PASS" ;;
            *) echo "smoke gate: FAIL"; exit 1 ;;
          esac

      - name: Smoke against real bands (VERT=1 lane: movers, portal and blasts at altitude)
        run: |
          set -euo pipefail
          out=$(VERT=1 node tools/smoke.js 2>&1) || true
          echo "$out" | sed -n '/--- VERT lane/,$p'
          # The lane's gating rows are ordinary asserts, so a REGRESSION (a shot passing through a
          # floor again, gravity deleted) fails the merge. Its KNOWN rows are filed defects that
          # re-read their own measurement every run and promote themselves to asserts when fixed, so
          # this step goes red on a regression without being a toll booth for #105 and #98.
          case "$out" in
            *"SMOKE PASSED"*) echo "vert smoke gate: PASS" ;;
            *) echo "vert smoke gate: FAIL"; exit 1 ;;
          esac

      - name: Probe gates (deterministic verdicts, must stay green)
        run: |
          set -euo pipefail
          # Seven probes whose verdict the code itself turns into an exit code, that seed their own
          # or run under CI's fixed SEED, and that write no artifact. Measured here at 1.6-5.0 s each,
          # ~17 s total, which is why they can live in the required job instead of beside it (#89).
          # heights and mip contain art-tuned thresholds: if one trips on a shading change it tripped
          # reproducibly, and that is a verdict about the change, not a flake.
          #   heights  ground solved per cell, which half of the frame moved, decal + deferred coverage
          #   mip      grazing-angle streak against the 1-D and mush controls
          #   anim     a body changes SHAPE while it walks, per kind, and dies 3 distinct ways per kind
          #   props    quad-vs-mesh, scale window, emissive exemption, feet on the floor
          #   vert     walk / step / fall / damage / ladder / spawn-altitude rows
          #   planes   derived ceiling array vs its formula, and the #55 raise-restore stale-blocker run
          #   sight    a shot aimed at a body on another band hits it, and a level shot does not hit
          #            through the floor under it - both directions fail, only the band-relative window passes
          node tools/view.js heights
          node tools/view.js mip
          node tools/view.js anim
          node tools/view.js props
          node tools/view.js vert
          node tools/view.js planes
          node tools/view.js sight
          node tools/view.js drop

  probes:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probes (they report, they do not gate)
        run: |
          set -uo pipefail
          # Reporting only: several of these describe known debt, and a red X that means "the ceiling
          # still has no anisotropic filtering" teaches everyone to ignore the checks that mean
          # something else. What changed is that each probe's own exit code is now captured and
          # printed. Before, this step ran `set -uo pipefail` with no -e and six bare commands, so its
          # status was the LAST probe's and a failure in the first five was thrown away (#89).
          # Read the list below as measurements, not as coverage: alt, exposure, contrast, decal,
          # diag, stats and sheets compute no exit code at all, and rig has a problem counter that is
          # printed but not wired to one. A "pass" line here does not mean checked.
          status=0
          for p in alt cull exposure contrast horizon rig stats sheets decal diag; do
            if node tools/view.js "$p" >/tmp/probe_$p.log 2>&1; then r=pass; else r=FAIL; status=1; fi
            echo "== $p: $r"
            tail -6 /tmp/probe_$p.log
          done
          # play (51 s) and scene (an artifact dump) stay out of CI entirely; run them by hand.
          exit $status

  seeds:
    name: seeds (informational)
    continue-on-error: true
    # Main pushes only. These two seeds exist to say "the numbers move a lot between generated
    # levels" - nothing about a diff can change that verdict, so running them per PR and per branch
    # push burned ~6 runner-minutes each time to re-print a known constant. The coverage still
    # happens after every merge, which is where a regression would actually show up.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Other seeds
        run: |
          set -uo pipefail
          # SEED=777 fails the perf gate on code nobody changed (ROADMAP P0) and this step cost more
          # than smoke itself, so it cannot live where it gates a merge.
          for s in 777 31337; do
            if out=$(SEED=$s node tools/smoke.js 2>&1); then
              echo "seed $s: passed"
            else
              echo "seed $s: would fail the gate (tracked as ROADMAP P0, not blocking any PR)"
              printf '%s\n' "$out" | tail -6
            fi
          done
