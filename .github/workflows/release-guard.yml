name: Release guard

on:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  release:
    # Scheduled debt must not overwrite the reviewed PR's required release check
    # on the same commit while publication is still completing.
    name: ${{ github.event_name == 'pull_request' && 'release' || 'release cadence (scheduled)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Published release cadence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 tools/release_policy.py status --repo "$GITHUB_REPOSITORY" --branch "$HEAD_BRANCH" --output "$RUNNER_TEMP/release-status.json"

      - name: Track release debt
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release_policy.py notify --repo "$GITHUB_REPOSITORY" --input "$RUNNER_TEMP/release-status.json"

      - name: Enforce cadence
        run: python3 tools/release_policy.py verdict --input "$RUNNER_TEMP/release-status.json"
