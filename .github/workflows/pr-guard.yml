name: PR guard

# Features leave release notes untouched. Versioned release PRs own them.

on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog changes only with releases
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 tools/release_policy.py check-changelog --base "$BASE_SHA" --branch "$HEAD_BRANCH"

  issue:
    runs-on: ubuntu-latest
    steps:
      - name: Issue reference required
        env:
          # Same rule as PR_BODY above: never spliced into the script, always read from env.
          # A body containing an apostrophe once closed the quote and broke the test.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if printf '%s' "$PR_BODY" | grep -qiE '\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]?:? *#[0-9]+'; then
            printf '%s\n' "$PR_BODY" | grep -oiE '\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]?:? *#[0-9]+' | head -3
            echo "references an issue, which GitHub closes on merge"
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -qiE '(refs?|see also):? *#[0-9]+'; then
            printf '%s\n' "$PR_BODY" | grep -oiE '(refs?|see also):? *#[0-9]+' | head -3
            echo "references an issue WITHOUT closing it - a milestone, or a related defect"
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -q '\[no-issue\]'; then
            echo "exempt: PR body carries [no-issue]"
            exit 0
          fi
          echo "The PR body names no issue."
          echo "Add a line such as 'Closes #13' (or 'Closes #13, #14'), or '[no-issue]' for"
          echo "work that is genuinely not tracked - the marker is the point: it has to be written"
          echo "down where someone can disagree with it."
          echo "Use the keyword, not a bare '#13': on a squash merge a bare reference links the"
          echo "issue but leaves it open, and an issue that is quietly never closed is worse than"
          echo "no issue at all, because it teaches everyone to ignore the tracker."
          exit 1

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Workflow YAML parses and can run
        # #107: a workflow that does not parse produces ZERO jobs, so nothing is reported on the PR
        # and an admin merge - `gh pr merge --admin` always bypasses protection rather than satisfying
        # it - goes through the gap. One step name grew a colon-space, which a plain YAML scalar cannot
        # carry, and all of ci.yml went inert while every check read green. A guard cannot check the
        # file it lives in, so the identical step is ALSO in ci.yml's required job: each one reports
        # the other breaking. The rules live in tools/wfyaml.rb, which fails loudly if the parser is
        # missing or the directory glob matches nothing, instead of passing.
        run: |
          set -euo pipefail
          ruby tools/wfyaml.rb --dir .github/workflows
