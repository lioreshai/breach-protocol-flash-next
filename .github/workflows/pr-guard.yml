name: PR guard

# A pull request must carry a CHANGELOG entry, because the changelog is the only place the
# history of this repo reads as intent rather than as diffs. Tooling-only PRs are exempt by
# marker, not by judgement - "does not affect the player" is exactly the claim most likely to be
# wrong, so it has to be written down where a reviewer can disagree with it.

on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CHANGELOG entry required
        env:
          # Passed as env, never spliced into the script. The previous version put
          # ${{ github.event.pull_request.body }} inside single quotes in the command, so a body
          # containing an apostrophe ("the repo's real gates") closed the quote and broke the
          # test - and any body at all was being interpreted by the shell, which is the same bug
          # with a security label on it.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE"
          if git diff --name-only "origin/$BASE"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is updated by this PR"
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -q '\[no-changelog\]'; then
            echo "exempt: PR body carries [no-changelog]"
            exit 0
          fi
          echo "CHANGELOG.md was not touched."
          echo "Add a line under Unreleased, or put [no-changelog] in the PR body for tooling-only work."
          exit 1
